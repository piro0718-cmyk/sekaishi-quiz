」とあります。"}, {"id": "q010", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ルネサンスの成立を保護した富豪の一族は？", "options": ["メディチ家", "チューダー朝", "ウマイヤ朝", "ナスル朝"], "explanation": "フィレンツェの富豪メディチ家の保護が記されています。"}, {"id": "q011", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "メディチ家が活動した都市は？", "options": ["フィレンツェ", "リスボン", "カリカット", "ヴィッテンベルク"], "explanation": "ノートでは、フィレンツェの富豪メディチ家とあります。"}, {"id": "q012", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートでは、ルネサンスをどのような文化と説明している？", "options": ["富豪の保護で成立した貴族文化", "固定地代で成立した領主文化", "新大陸で成立した奴隷文化", "国教会の成立による農民文化"], "explanation": "メディチ家の保護によって成立した一種の貴族文化と整理されています。"}, {"id": "q013", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "『モナリザ』『最後の晩餐』の作者は？", "options": ["レオナルド・ダ・ヴィンチ", "ミケランジェロ", "ラファエロ", "グーテンベルク"], "explanation": "ノートでは、この2作品がレオナルド・ダ・ヴィンチの作品として挙げられています。"}, {"id": "q014", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "『ダヴィデ像』『最後の審判』の作者は？", "options": ["ミケランジェロ", "ラファエロ", "レオナルド・ダ・ヴィンチ", "ガリレオ・ガリレイ"], "explanation": "ミケランジェロの作品として2作品が記されています。"}, {"id": "q015", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ラファエロの作品として挙げられているのは？", "options": ["聖母子像", "モナリザ", "最後の晩餐", "ダヴィデ像"], "explanation": "ノートではラファエロの欄に聖母子像とあります。"}, {"id": "q016", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートにある「ルネサンスの三巨匠」の組み合わせは？", "options": ["ダ・ヴィンチ／ミケランジェロ／ラファエロ", "コペルニクス／ブルーノ／ガリレイ", "ルター／カルヴァン／ヘンリー8世", "ディアス／ダ・ガマ／コロンブス"], "explanation": "ルネサンスの三巨匠として、この3人が並んでいます。"}, {"id": "q017", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートで「科学にとっては暗黒時代」とされているのは？", "options": ["中世", "ルネサンス", "大航海時代", "17世紀以降"], "explanation": "中世はローマ教会の力が強すぎて、自由な研究や発想が禁止されたとあります。"}, {"id": "q018", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートでは、中世に自由な研究が抑えられた理由は？", "options": ["ローマ教会の力が強かったため", "メディチ家が保護したため", "活版印刷が普及したため", "主権を相互承認したため"], "explanation": "自由な研究や発想を妨げた背景として、ローマ教会の強い力が挙げられています。"}, {"id": "q019", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ローマ教会が公認していた学説は？", "options": ["プトレマイオスの天動説", "アリスタルコスの地動説", "カルヴァンの予定説", "ルターの聖書主義"], "explanation": "ノートでは、プトレマイオスの天動説が真実として公認されたとあります。"}, {"id": "q020", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートにある天動説の説明は？", "options": ["宇宙の中心に地球があり、太陽が地球の周りを回る", "宇宙の中心に太陽があり、地球が太陽の周りを回る", "救済はあらかじめ決められている", "国家は互いの主権を認め合う"], "explanation": "天動説は、地球を中心に太陽が回るという説明です。"}, {"id": "q021", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "禁書とされた地動説の提唱者として挙げられているのは？", "options": ["アリスタルコス", "プトレマイオス", "イグナティウス・ロヨラ", "トスカネリ"], "explanation": "ノートでは、アリスタルコスの地動説が禁書とされたとあります。"}, {"id": "q022", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートにある地動説の説明は？", "options": ["太陽を中心に地球が回る", "地球を中心に太陽が回る", "地球を中心に信仰が決まる", "太陽を中心に主権を承認する"], "explanation": "地動説では、宇宙の中心に太陽があり、その周りを地球が回ると整理されています。"}, {"id": "q023", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "『天体回転論』で地動説を発表したのは？", "options": ["コペルニクス", "ガリレオ・ガリレイ", "ジョルダーノ・ブルーノ", "プトレマイオス"], "explanation": "ポーランドの聖職者コペルニクスが『天体回転論』を発表したとあります。"}, {"id": "q024", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "コペルニクスは、どこの聖職者と記されている？", "options": ["ポーランド", "イタリア", "ドイツ", "フランス"], "explanation": "ノートには「ポーランドの聖職者 コペルニクス」とあります。"}, {"id": "q025", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "地動説への支持を表明し、宗教裁判で異端とされ火刑になったのは？", "options": ["ジョルダーノ・ブルーノ", "コペルニクス", "ガリレオ・ガリレイ", "グーテンベルク"], "explanation": "イタリアの学者ジョルダーノ・ブルーノについての記述です。"}, {"id": "q026", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "自作の望遠鏡で木星を観測した科学者は？", "options": ["ガリレオ・ガリレイ", "マルコ・ポーロ", "コペルニクス", "アリスタルコス"], "explanation": "ガリレオ・ガリレイは木星の観測によって地動説を確認したとノートにあります。"}, {"id": "q027", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ガリレオ・ガリレイの著書として挙げられているのは？", "options": ["天文対話", "天体回転論", "世界の記述", "九十五カ条の論題"], "explanation": "ガリレオの欄に、著書『天文対話』とあります。"}, {"id": "q028", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートでは、ガリレオは宗教裁判で何を迫られた？", "options": ["自説の撤回", "聖書のドイツ語訳", "修道院の土地の売却", "イギリス国教会の設立"], "explanation": "ノートには、宗教裁判で自説の撤回を迫られたとあります。引用句の史実判定は出題していません。"}, {"id": "q029", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "ノートにある「ルネサンスの三大発明品」の組み合わせは？", "options": ["火薬／羅針盤／活版印刷", "望遠鏡／聖母子像／贖宥状", "火薬／ナントの勅令／羅針盤", "天文対話／活版印刷／贖宥状"], "explanation": "ノートでは火薬（火砲）、羅針盤、活版印刷の3つが挙げられています。"}, {"id": "q030", "chapter": "ルネサンスと科学", "source": "IMG_0518・0519", "q": "活版印刷を発明し、宗教改革につながる聖書の複製を容易にしたのは？", "options": ["グーテンベルク", "カルヴァン", "メディチ家", "コルテス"], "explanation": "ドイツ人グーテンベルクの活版印刷によって、聖書の複製が容易になりました。"}, {"id": "q031", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ウマイヤ朝成立後、キリスト教徒がイスラム教徒を半島から駆逐しようとした運動は？", "options": ["レコンキスタ", "宗教改革", "対抗宗教改革", "商業革命"], "explanation": "ノートでは、約800年にわたる国土回復運動をレコンキスタとしています。"}, {"id": "q032", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "レコンキスタの舞台となった半島は？", "options": ["イベリア半島", "アフリカ南端", "インド西岸", "新大陸"], "explanation": "ノートでは、イベリア半島でのキリスト教徒とイスラム教徒の動きから説明されています。"}, {"id": "q033", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ポルトガルが12世紀に独立した相手は？", "options": ["カスティリヤ王国", "アラゴン王国", "スペイン王国", "神聖ローマ帝国"], "explanation": "ノートには、12世紀にカスティリヤ王国から独立とあります。"}, {"id": "q034", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ポルトガルで新航路開拓事業を進めた航海王子は？", "options": ["エンリケ", "アンリ", "ヘンリー8世", "レオ10世"], "explanation": "「航海王子エンリケによる新航路開拓事業」とあります。"}, {"id": "q035", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "スペイン王国成立につながった合併は？", "options": ["カスティリヤ王国とアラゴン王国", "カスティリヤ王国とポルトガル", "アラゴン王国とナスル朝", "神聖ローマ帝国とポルトガル"], "explanation": "この2王国の合併がスペイン王国成立につながりました。"}, {"id": "q036", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ノートにあるスペイン王国の成立年は？", "options": ["1479年", "1492年", "1488年", "1534年"], "explanation": "1479年にスペイン王国が成立したとあります。"}, {"id": "q037", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "1492年、グラナダの陥落によって滅亡したのは？", "options": ["ナスル朝", "ウマイヤ朝", "チューダー朝", "メディチ家"], "explanation": "グラナダ陥落、ナスル朝滅亡、レコンキスタ完成という流れです。"}, {"id": "q038", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "レコンキスタが完成した年は？", "options": ["1492年", "1479年", "1498年", "1522年"], "explanation": "ノートでは1492年のナスル朝滅亡をレコンキスタ完成としています。"}, {"id": "q039", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "新航路開拓で、ヨーロッパ勢力が直接取引したかった主な商品は？", "options": ["アジア原産の香辛料", "新大陸原産のトマト", "修道院の土地", "ドイツ語訳の聖書"], "explanation": "東方貿易の利益を求め、とくにコショウなどの香辛料の原産地との直接取引を目指しました。"}, {"id": "q040", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "新航路開拓の経済的な理由として挙げられているのは？", "options": ["東方（レヴァント）貿易の利益を得たい", "固定地代を維持したい", "贖宥状の販売を広げたい", "宗教裁判所を強化したい"], "explanation": "ノートでは、東方（レヴァント）貿易の貿易利益がほしいと整理されています。"}, {"id": "q041", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "『世界の記述（東方見聞録）』の著者は？", "options": ["マルコ・ポーロ", "アメリゴ・ヴェスプッチ", "コペルニクス", "ガリレオ・ガリレイ"], "explanation": "東方への関心を高めた著書として挙げられています。"}, {"id": "q042", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ノートで、中国の東にある黄金の国とされたのは？", "options": ["ジパング", "グラナダ", "リスボン", "カリカット"], "explanation": "ジパングについて「JAPANへ」と書き添えられています。"}, {"id": "q043", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ノートにある、伝説のキリスト教国の王は？", "options": ["プレスター・ジョン", "レオ10世", "ヘンリー8世", "イグナティウス・ロヨラ"], "explanation": "東方への関心を高めた要素として、プレスター・ジョン伝説が挙げられています。"}, {"id": "q044", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "遠洋航海を可能にした技術の発達は？", "options": ["羅針盤や火砲", "贖宥状や聖書", "固定地代や蓄財", "聖母子像やダヴィデ像"], "explanation": "新航路開拓の理由の3つ目として、羅針盤や火砲の発達が書かれています。"}, {"id": "q045", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "新航路開拓の宗教的な動機に当たるのは？", "options": ["キリスト教世界の拡大", "教皇至上権の否定だけ", "カトリックの放棄", "予定説の撤回"], "explanation": "ノートではレコンキスタの成功体験と結びつけ、キリスト教世界の拡大を挙げています。"}, {"id": "q046", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "1488年、アフリカ南端の喜望峰に到達したのは？", "options": ["バルトロメウ・ディアス", "ヴァスコ・ダ・ガマ", "コロンブス", "マゼラン"], "explanation": "アフリカ沿岸を南下したディアスの到達が記されています。"}, {"id": "q047", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "バルトロメウ・ディアスが喜望峰に到達した年は？", "options": ["1488年", "1498年", "1492年", "1522年"], "explanation": "ノートの左側に1488年とあります。"}, {"id": "q048", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "1498年、インド西岸のカリカットに到達したのは？", "options": ["ヴァスコ・ダ・ガマ", "バルトロメウ・ディアス", "アメリゴ・ヴェスプッチ", "ピサロ"], "explanation": "ダ・ガマのカリカット到達が新航路開拓の成功として整理されています。"}, {"id": "q049", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ヴァスコ・ダ・ガマが到達した場所は？", "options": ["インド西岸のカリカット", "アフリカ南端の喜望峰", "サンサルバドル島", "メキシコのアステカ王国"], "explanation": "ノートでは1498年、インド西岸カリカット到達とあります。"}, {"id": "q050", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ポルトガル側の記述で、1522年に征服とされている場所は？", "options": ["モルッカ諸島", "サンサルバドル島", "喜望峰", "グラナダ"], "explanation": "ノートには1522年、モルッカ諸島征服、ヨーロッパの最終目的地とあります。"}, {"id": "q051", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "香辛料貿易によって繁栄したポルトガルの首都は？", "options": ["リスボン", "フィレンツェ", "ヴィッテンベルク", "グラナダ"], "explanation": "香辛料貿易による莫大な富と、首都リスボンの繁栄が記されています。"}, {"id": "q052", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "1492年、コロンブスはどちら回りでアジアを目指した？", "options": ["西回り", "アフリカ沿岸を南下", "インド西岸から北上", "地中海沿岸だけを周回"], "explanation": "スペイン側の欄に、西回りでアジア到達を目指したとあります。"}, {"id": "q053", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "コロンブスが参考にした地球球体説は、誰の説として記されている？", "options": ["トスカネリ", "プトレマイオス", "アリスタルコス", "ブルーノ"], "explanation": "ノートには「トスカネリの地球球体説」とあります。"}, {"id": "q054", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "コロンブスが1492年に到達した島は？", "options": ["サンサルバドル島", "モルッカ諸島", "喜望峰", "カリカット"], "explanation": "ノートでは、サンサルバドル島に到達したとあります。"}, {"id": "q055", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "ノートでは、コロンブスの3度の航海で獲得できなかったのは？", "options": ["香辛料", "贖宥状", "修道院の土地", "ドイツ語訳の聖書"], "explanation": "3度の航海も香辛料を獲得できなかったと記されています。"}, {"id": "q056", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "到達した場所を未知の大陸と判明させた人物として挙げられているのは？", "options": ["アメリゴ・ヴェスプッチ", "コロンブス", "バルトロメウ・ディアス", "エンリケ"], "explanation": "ノートでは1500年の欄にアメリゴ・ヴェスプッチによって未知の大陸と判明、と整理されています。"}, {"id": "q057", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "「アメリカ大陸」という呼び名につながった人物は？", "options": ["アメリゴ・ヴェスプッチ", "マゼラン", "コルテス", "マルコ・ポーロ"], "explanation": "ヴェスプッチによる判明から、アメリカ大陸と呼ばれるようになったとあります。"}, {"id": "q058", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "マゼラン一行の世界周航が行われた期間は？", "options": ["1519〜1522年", "1524〜1525年", "1562〜1598年", "1618〜1648年"], "explanation": "ノートには1519〜22年、マゼラン一行世界周航達成とあります。"}, {"id": "q059", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "世界周航の達成で、証明されたとノートにあるのは？", "options": ["地球球体説", "天動説", "予定説", "聖書主義"], "explanation": "マゼラン一行の世界周航から、地球球体説が証明されたという流れです。"}, {"id": "q060", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "新大陸に渡る征服者を何と呼んだ？", "options": ["コンキスタドール", "ピューリタン", "ユグノー", "プレスビテリアン"], "explanation": "世界周航の記述に続き、征服者コンキスタドールの渡航が増加したとあります。"}, {"id": "q061", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "1521年、アステカ王国を征服したのは？", "options": ["コルテス", "ピサロ", "コロンブス", "ヴァスコ・ダ・ガマ"], "explanation": "ノートでは、メキシコのアステカ王国をコルテスが征服したとあります。"}, {"id": "q062", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "1532〜1533年、インカ帝国を征服したのは？", "options": ["ピサロ", "コルテス", "ディアス", "マゼラン"], "explanation": "ペルーのインカ帝国をピサロが征服したとあります。"}, {"id": "q063", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "インカ帝国の征服後の流れで、発見が挙げられている銀山は？", "options": ["ポトシ銀山", "喜望峰", "グラナダ", "モルッカ諸島"], "explanation": "インカ帝国征服に続けて、ポトシ銀山の発見が記されています。"}, {"id": "q064", "chapter": "大航海時代", "source": "IMG_0520・0521", "q": "先住民インディオの人口激減の後、何が進んだとある？", "options": ["アフリカからの黒人奴隷輸入", "ヨーロッパからの聖職者追放", "アジアからの領主移住", "イギリスからの贖宥状輸入"], "explanation": "ノートは、先住民の人口激減からアフリカからの黒人奴隷輸入へとつなげています。"}, {"id": "q065", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "聖書の広い普及を可能にし、教会への疑問につながった技術は？", "options": ["活版印刷", "羅針盤", "火砲", "望遠鏡"], "explanation": "活版印刷技術の発達で聖書が広く普及し、ローマ教会の教えに疑問が発生したとあります。"}, {"id": "q066", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ノートが宗教改革の主な場所として挙げる3か所は？", "options": ["ドイツ・スイス・イギリス", "ポルトガル・スペイン・イタリア", "フランス・オランダ・ポーランド", "メキシコ・ペルー・インド"], "explanation": "ノートでは、この3か所からヨーロッパ全域へ影響したと整理されています。"}, {"id": "q067", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "贖宥状の発売を許可したローマ教皇は？", "options": ["レオ10世", "ヘンリー8世", "ルター", "カルヴァン"], "explanation": "ノートにはローマ教皇レオ10世とあります。"}, {"id": "q068", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "レオ10世が贖宥状の発売を許可した目的は？", "options": ["聖ピエトロ大聖堂の改修費用を得るため", "新航路の開拓費用を得るため", "ポトシ銀山を開発するため", "ナントの勅令を発するため"], "explanation": "ノートでは、聖ピエトロ大聖堂の改修費用をねん出するためとあります。"}, {"id": "q069", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ノートで贖宥状の別名として書かれているのは？", "options": ["免罪符", "国王至上法", "ナントの勅令", "九十五カ条の論題"], "explanation": "贖宥状の横に「免罪符」とあります。"}, {"id": "q070", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "贖宥状販売が広く行われた中心地域は？", "options": ["神聖ローマ帝国", "スペイン王国", "ポルトガル", "インカ帝国"], "explanation": "ノートでは、神聖ローマ帝国を中心に販売されたとあります。"}, {"id": "q071", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "神聖ローマ帝国が贖宥状販売に組織的に抵抗できなかった理由は？", "options": ["分裂状態だったため", "海上貿易で繁栄したため", "予定説を採用したため", "主権を相互承認したため"], "explanation": "帝国が分裂状態で、組織的な抵抗ができなかったとあります。"}, {"id": "q072", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "贖宥状販売に関して、神聖ローマ帝国は何と呼ばれた？", "options": ["ローマの牝牛", "黄金の国", "清教徒", "普遍的な教会"], "explanation": "ノートには「ローマの牝牛（めうし）」と呼ばれたとあります。"}, {"id": "q073", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "1517年に『九十五カ条の論題』を発表したのは？", "options": ["ルター", "カルヴァン", "ヘンリー8世", "レオ10世"], "explanation": "ルターが宗教改革の口火を切ったと記されています。"}, {"id": "q074", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターが『九十五カ条の論題』を発表した年は？", "options": ["1517年", "1534年", "1555年", "1598年"], "explanation": "ノートのルターの段落は1517年から始まります。"}, {"id": "q075", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターはどこの大学の神学教授だった？", "options": ["ヴィッテンベルク大学", "フィレンツェの大学", "リスボンの大学", "カリカットの大学"], "explanation": "ノートにはヴィッテンベルク大学の神学教授とあります。"}, {"id": "q076", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターの「聖書だけを信仰のよりどころとする」考え方は？", "options": ["聖書主義", "予定説", "職業召命説", "勢力均衡"], "explanation": "聖書だけを信仰のよりどころとする考えを聖書主義と記しています。"}, {"id": "q077", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターが完成させた、聖書の翻訳は？", "options": ["ドイツ語訳", "フランス語訳", "イタリア語訳", "ポーランド語訳"], "explanation": "ノートには、聖書のドイツ語訳を完成とあります。"}, {"id": "q078", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターが否定したものとしてノートにあるのは？", "options": ["ローマ教皇と教会組織の権威", "聖書を信仰のよりどころとすること", "信仰による魂の救済", "聖書のドイツ語訳"], "explanation": "ルターは教皇と教会組織の権威を否定しました。"}, {"id": "q079", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターによれば、魂の救済を決めるものは？", "options": ["福音に対する信仰", "贖宥状を買った金額", "商売で得た利益", "修道院の土地の広さ"], "explanation": "善行ではなく、福音（神の教え）に対する信仰によって決まるとあります。"}, {"id": "q080", "chapter": "宗教改革の始まり", "source": "IMG_0522", "q": "ルターの考えでは、贖宥状を買う必要はある？", "options": ["信仰による救済なので必要ない", "聖書を訳すために必要", "国教会を作るために必要", "新航路を開くために必要"], "explanation": "ノートには、魂の救済は信仰によるので、贖宥状などを買う必要はないとあります。"}, {"id": "q081", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "スイスで宗教改革を行ったフランス人は？", "options": ["カルヴァン", "ルター", "ヘンリー8世", "レオ10世"], "explanation": "「スイス」の見出しに、フランス人カルヴァンによる宗教改革とあります。"}, {"id": "q082", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "カルヴァンの、魂が救われるかはあらかじめ決まっているという説は？", "options": ["予定説", "天動説", "地動説", "地球球体説"], "explanation": "ノートには「魂が救われるかどうかは予定されている」とあります。"}, {"id": "q083", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "カルヴァンは、ルターのどの立場に賛同した？", "options": ["教会組織の否定と聖書主義", "教皇至上権と贖宥状の販売", "国王の離婚と国教会の設立", "修道院の土地没収と安価での売却"], "explanation": "カルヴァンはルターに賛同し、教会組織を否定して聖書主義をとったとあります。"}, {"id": "q084", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "カルヴァンの予定説から、贖宥状について導かれる考えは？", "options": ["買う必要はない", "利益のすべてで買う", "領主だけが買える", "国王が販売を独占する"], "explanation": "救済が予定されているので、贖宥状などを買う必要はないとあります。"}, {"id": "q085", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "神に与えられた環境や職業を誠実に生きるという考えは？", "options": ["職業召命説", "聖書主義", "勢力均衡", "国王至上法"], "explanation": "カルヴァンの職業召命説として説明されています。"}, {"id": "q086", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "カルヴァンは、商売によって得た利益をどう考えた？", "options": ["持っていてもよいとし、蓄財を肯定", "すべて教会に寄付すべきとした", "すべて贖宥状に使うべきとした", "利益を得る商売を禁止した"], "explanation": "ノートでは、利益を持っていてもよく、蓄財を肯定したとあります。"}, {"id": "q087", "chapter": "カルヴァンと各地の新教徒", "source": "IMG_0523", "q": "カルヴァンの考えは、とくにどの層に受け入れられた？", "options": ["商人層", "固定地代で暮らす領主層", "インディオ", "ローマ教皇"], "explanation": "蓄財の肯定によって商人層に受け入れられたとあります。"}, {"id": "q088", "chapter": "カルヴァンと各地の新教徒", function cleanRecords(records){const out={};if(!records||typeof records!=='object')return out;for(const q of QUESTIONS){let r=records[q.id];if(r&&typeof r==='object'&&typeof r.wrong==='boolean'&&Number.isInteger(r.seen)&&r.seen>0&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.seen)out[q.id]={wrong:r.wrong,seen:r.seen,correct:r.correct};}return out;}
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw){state.records=cleanRecords(raw.records);state.active=validActive(raw.active)?raw.active:null;}localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function wrongIds(){return QUESTIONS.filter(q=>state.records[q.id]?.wrong).map(q=>q.id);}
function matches(q){return topic==='all'||q.chapter===topic;}
function pool(){return QUESTIONS.filter(q=>matches(q)&&(mode==='wrong'?state.records[q.id]?.wrong:mode==='unseen'?!state.records[q.id]:true));}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function notice(){return storageOK?'':'<p class="notice">このブラウザでは履歴を保存できません。記録を残すには「履歴のバックアップ」を使ってください。</p>';}
function home(){const seen=Object.keys(state.records).length,wrong=wrongIds().length,learned=seen-wrong;
app.innerHTML=`<section class="hero"><span class="eyebrow">WORLD HISTORY / NOTE 01—09</span><h1>ノートの知識を、<br>自分のものに。</h1><p class="intro">ルネサンスから世界の一体化まで。<br>9枚のノートだけでつくった、146問の4択。</p><span class="tag">1回10問から · 解説付き</span></section>${notice()}
<div class="stats"><div class="stat"><strong>${seen}<small style="font-size:12px"> / 146</small></strong><span>解いた問題</span></div><div class="stat"><strong>${learned}</strong><span>直近で正解</span></div><div class="stat"><strong style="color:var(--orange)">${wrong}</strong><span>復習する問題</span></div></div>
${state.active&&state.active.index<state.active.items.length?`<section class="card resume"><h2>途中から続けられます</h2><p class="tiny">${state.active.index+1} / ${state.active.items.length}問目まで進んでいます。</p><button id="resume" class="primary" style="margin-top:10px">続きから解く →</button></section>`:''}
<section class="card"><h2>今日はどこを復習する？</h2><div class="modes"><button class="mode ${mode==='all'?'active':''}" data-mode="all" aria-pressed="${mode==='all'}"><strong>すべてから</strong><small>ランダムに出題</small></button><button class="mode ${mode==='wrong'?'active':''}" data-mode="wrong" aria-pressed="${mode==='wrong'}"><strong>間違えた問題だけ</strong><small>正解したら復習リストから外す</small></button><button class="mode ${mode==='unseen'?'active':''}" data-mode="unseen" aria-pressed="${mode==='unseen'}"><strong>まだ解いていない問題</strong><small>ノートの範囲をひと通り</small></button><button class="mode ${mode==='full'?'active':''}" data-mode="full" aria-pressed="${mode==='full'}"><strong>分野をひと通り</strong><small>選んだ範囲を全問</small></button></div>
<div class="fields"><label>出題する分野<select id="topic"><option value="all">すべての分野</option>${chapters.map(c=>`<option value="${esc(c)}" ${topic===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>1回の問題数<select id="limit" ${mode==='full'?'disabled':''}>${['10','20','all'].map(n=>`<option value="${n}" ${limit===n?'selected':''}>${n==='all'?'全問':n+'問'}</option>`).join('')}</select></label></div><p id="poolInfo" class="tiny"></p><button id="start" class="primary">トレーニングを始める →</button></section>
<p class="section-label">7つの分野 / 全146問</p><div class="chapters">${chapters.map((c,i)=>{const qs=QUESTIONS.filter(q=>q.chapter===c),n=qs.filter(q=>state.records[q.id]&&!state.records[q.id].wrong).length;return `<div class="chapter"><span><b>0${i+1}</b>　${esc(c)}</span><span>${n} / ${qs.length} 正解</span></div>`;}).join('')}</div>
<details><summary>ノートの範囲・復習のしくみ</summary><p>出典：IMG_0518〜0526の9枚。写真の中心の各ページを読み、ノートの人物・用語・作品・年号・因果関係から出題しました。写真の端で切れている隣ページや、判読が確実でない書き込みは含めていません。外部資料は加えていません。</p><p>間違えた問題を記録し、以後のトレーニングで正解すると復習リストから外します。再び間違えたら、もう一度リストに入ります。選択肢と問題の順番は毎回変わります。</p><p>履歴は同じ端末・同じブラウザ・同じサイト内に保存されます。別の端末とは自動同期されません。ブラウザのデータ削除やプライベート閲覧では履歴が失われることがあります。</p></details>
<details><summary>履歴のバックアップ・読み込み</summary><p>機種やブラウザを変えるときは、履歴を書き出して移せます。</p><button id="export" class="secondary">履歴をバックアップ</button><label class="file-label" for="import">バックアップを読み込む</label><input id="import" type="file" accept=".json,application/json"><p class="tiny">読み込むと、現在の履歴と途中のトレーニングを置き換えます。</p></details><details><summary class="danger">学習履歴をリセット</summary><button id="reset" class="secondary danger">全履歴を削除する</button></details><footer>WORLD HISTORY NOTE · 2026.10<br>少しずつ、間違いを減らそう。</footer>`;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home();});document.getElementById('topic').onchange=e=>{topic=e.target.value;updatePool();};document.getElementById('limit').onchange=e=>{limit=e.target.value;updatePool();};document.getElementById('start').onclick=start;
document.getElementById('resume')?.addEventListener('click',()=>{question();scrollTop();});
document.getElementById('reset').onclick=()=>{if(confirm('学習履歴と途中のトレーニングをすべて削除しますか？')){state={records:{},active:null};save();home();}};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:KEY,records:state.records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='world-history-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!==KEY||!data.records||typeof data.records!=='object')throw Error();const records=cleanRecords(data.records);if(confirm('バックアップの履歴で、現在の学習履歴を置き換えますか？')){state={records,active:null};save();home();}}catch(e){alert('この教材のバックアップファイルを選んでください。');}};updatePool();}
function updatePool(){const n=pool().length,k=mode==='full'||limit==='all'?n:Math.min(Number(limit),n);document.getElementById('poolInfo').textContent=n?`対象 ${n}問から、${k}問を出題します。`:mode==='wrong'?'この範囲に間違えた問題はありません。':mode==='unseen'?'この範囲はすべて解いています。':'この範囲の問題はありません。';document.getElementById('start').disabled=!n;}
function start(){let qs=shuffle(pool());if(!qs.length)return;if(mode!=='full'&&limit!=='all')qs=qs.slice(0,Number(limit));if(state.active&&state.active.index<state.active.items.length&&!confirm('途中のトレーニングを終了し、新しく始めますか？ 学習履歴は残ります。'))return;
state.active={items:qs.map(q=>({id:q.id,order:shuffle([0,1,2,3])})),index:0,answers:[],selected:null,mode};save();question();scrollTop();}
function question(){const a=state.active;if(!a)return home();if(a.index>=a.items.length)return results();const item=a.items[a.index],q=lookup[item.id],answered=a.selected!==null;app.innerHTML=`<div class="qtop"><span>${esc(q.chapter)}</span><span>${a.index+1} / ${a.items.length}問</span></div><div class="progress"><i style="width:${a.index/a.items.length*100}%"></i></div><section class="card qcard"><p class="qnumber">QUESTION ${String(a.index+1).padStart(2,'0')} ${a.mode==='wrong'?'<span class="hint-chip">間違い復習</span>':''}</p><h2 class="question" tabindex="-1">${esc(q.q)}</h2><div class="choices">${item.order.map((opt,i)=>`<button class="choice ${answered?(opt===0?'correct':a.selected===i?'wrong':'faded'):''}" data-i="${i}" ${answered?'disabled':''}><span class="letter">${answered&&opt===0?'✓':'ABCD'[i]}</span><span>${esc(q.options[opt])}</span></button>`).join('')}</div>${answered?`<div class="feedback ${item.order[a.selected]===0?'':'miss'}" role="status"><strong>${item.order[a.selected]===0?'正解！':'正解は '+ 'ABCD'[item.order.indexOf(0)]+' です'}</strong><p>${esc(q.explanation)}</p><p class="tiny">${item.order[a.selected]===0?'この問題は復習リストに残りません。':'「間違えた問題だけ」に記録しました。'}</p><div class="source">出典：${esc(q.source)} · ${q.id.toUpperCase()}</div></div><button id="next" class="primary">${a.index+1===a.items.length?'今回の結果を見る':'次の問題へ →'}</button>`:'<p class="tiny" style="margin-top:17px">答えを1つ選んでください。</p>'}</section>${notice()}<p class="tiny" style="text-align:center">${answered?'回答と履歴を記録しました。':'ホームに戻っても、続きから再開できます。'}</p>`;
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.getElementById('next')?.addEventListener('click',()=>{a.index++;a.selected=null;save();question();scrollTop();});}
function answer(i){let a=state.active;if(!a||a.selected!==null)return;const item=a.items[a.index];const correct=item.order[i]===0;a.selected=i;a.answers.push({id:item.id,correct});const r=state.records[item.id]||{seen:0,correct:0,wrong:false};r.seen++;r.correct+=correct?1:0;r.wrong=!correct;state.records[item.id]=r;save();question();document.getElementById('next')?.focus({preventScroll:true});}
function results(){const a=state.active,good=a.answers.filter(x=>x.correct).length,miss=a.answers.filter(x=>!x.correct),wrong=wrongIds().length;app.innerHTML=`<section class="result"><span class="eyebrow">SESSION COMPLETE</span><h1>おつかれさま。</h1><div class="score">${good}<small> / ${a.items.length}</small></div><p class="muted">${good===a.items.length?'全問正解！ この調子で進もう。':'間違いは、次に覚えるための目印。'}</p></section><section class="card"><h2>${miss.length?'今回の間違いは '+miss.length+'問':'今回の問題はすべて正解'}</h2><p class="tiny">全範囲の復習リスト：${wrong}問。<br>復習で正解できた問題は、リストから外れます。</p>${wrong?'<button id="retry" class="primary">間違えた問題だけ復習する →</button>':'<p class="empty">復習リストは空です。よくがんばりました。</p>'}<button id="back" class="secondary">ホームに戻る</button></section>${miss.length?`<section class="card"><h2>今回の振り返り</h2>${miss.map(x=>{const q=lookup[x.id];return `<div class="reviewrow"><strong>${esc(q.q)}</strong><p style="color:var(--green)">正解：${esc(q.options[0])}</p><p class="tiny">${esc(q.explanation)}</p><div class="source">${esc(q.source)} · ${q.id.toUpperCase()}</div></div>`;}).join('')}</section>`:''}`;document.getElementById('back').onclick=()=>{home();scrollTop();};document.getElementById('retry')?.addEventListener('click',()=>{mode='wrong';topic='all';limit='all';start();});}
document.getElementById('homeBtn').onclick=()=>{home();scrollTop();};home();
</script>
</body></html>
