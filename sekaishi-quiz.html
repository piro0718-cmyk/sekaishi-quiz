  const [cur,setCur]=useState(0);
  const [revealed,setRevealed]=useState(false);
  const [picked,setPicked]=useState(null);
  const [score,setScore]=useState(0);
  const [results,setResults]=useState([]);
  const [weakIds,setWeakIds]=useState(()=>loadWeak());
  const [isWeak,setIsWeak]=useState(false);
  const F={fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif"};

  const weakQs=ALL_QUESTIONS.filter(q=>weakIds.has(q.id));
  const totalSel=ALL_QUESTIONS.filter(q=>selTopics.has(q.topic)&&selTiers.has(q.tier)).length;

  function startNormal(){
    const f=shuffle(ALL_QUESTIONS.filter(q=>selTopics.has(q.topic)&&selTiers.has(q.tier)));
    if(!f.length)return;
    setQs(f);setCur(0);setScore(0);setResults([]);setRevealed(false);setPicked(null);setIsWeak(false);setMode("quiz");
  }
  function startWeak(){
    if(!weakQs.length)return;
    const f=shuffle(weakQs);
    setQs(f);setCur(0);setScore(0);setResults([]);setRevealed(false);setPicked(null);setIsWeak(true);setMode("quiz");
  }
  function toggleTier(t){setSelTiers(p=>{const n=new Set(p);if(n.has(t)){if(n.size>1)n.delete(t);}else n.add(t);return n;});}
  function toggleTopic(t){setSelTopics(p=>{const n=new Set(p);if(n.has(t)){if(n.size>1)n.delete(t);}else n.add(t);return n;});}

  function updateWeak(qobj,correct){
    const n=new Set(weakIds);
    correct?n.delete(qobj.id):n.add(qobj.id);
    setWeakIds(n);saveWeak(n);
  }
  function pickChoice(ch){
    if(revealed)return;
    setPicked(ch);setRevealed(true);
    const ok=ch===qs[cur].a;
    if(ok)setScore(s=>s+1);
    updateWeak(qs[cur],ok);
    setResults(r=>[...r,{...qs[cur],correct:ok,picked:ch}]);
  }
  function selfScore(ok){
    if(ok)setScore(s=>s+1);
    updateWeak(qs[cur],ok);
    setResults(r=>[...r,{...qs[cur],correct:ok}]);
    advance();
  }
  function advance(){
    setRevealed(false);setPicked(null);
    if(cur+1>=qs.length)setMode("result");else setCur(c=>c+1);
  }

  const q=qs[cur];
  const c=q?(TC[q.topic]||TC["明"]):null;
  const prog=qs.length?(cur/qs.length)*100:0;

  if(mode==="home") return (
    <div style={{...F,minHeight:"100vh",background:"#0f172a",padding:"18px 14px",boxSizing:"border-box"}}>
      <div style={{maxWidth:500,margin:"0 auto"}}>
        <div style={{textAlign:"center",marginBottom:18}}>
          <div style={{fontSize:36}}>📜</div>
          <h1 style={{color:"#f1f5f9",fontSize:19,fontWeight:900,margin:"4px 0 2px"}}>世界史テスト対策</h1>
          <p style={{color:"#64748b",fontSize:11,margin:0}}>暗記120問 ＋ 比較⚖️ 順番📅 因果関係🔗</p>
        </div>

        {weakQs.length>0&&(
          <div style={{background:"rgba(248,113,113,0.08)",border:"2px solid rgba(248,113,113,0.35)",borderRadius:14,padding:14,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div>
                <div style={{color:"#f87171",fontWeight:900,fontSize:14}}>🔥 苦手問題モード</div>
                <div style={{color:"#94a3b8",fontSize:11,marginTop:2}}>蓄積中: {weakQs.length}問</div>
              </div>
              <button onClick={()=>{const n=new Set();setWeakIds(n);saveWeak(n);}} style={{background:"transparent",border:"1px solid #475569",color:"#64748b",borderRadius:8,padding:"4px 8px",fontSize:10,cursor:"pointer"}}>リセット</button>
            </div>
            <button onClick={startWeak} style={{width:"100%",padding:"13px",borderRadius:11,fontSize:14,fontWeight:900,background:"linear-gradient(90deg,#ef4444,#f97316)",color:"#fff",border:"none",cursor:"pointer"}}>🔥 苦手だけ復習する（{weakQs.length}問）</button>
          </div>
        )}

        <div style={{background:"#1e293b",borderRadius:14,padding:14,marginBottom:12}}>
          <p style={{color:"#94a3b8",fontSize:11,fontWeight:700,margin:"0 0 10px"}}>▶ 問題の種類・難易度</p>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {TIERS.map(t=>{
              const on=selTiers.has(t);
              const icons={1:"📝",2:"📝",3:"⚖️",4:"📅",5:"🔗"};
              return (
                <button key={t} onClick={()=>toggleTier(t)} style={{
                  padding:"11px 14px",borderRadius:10,textAlign:"left",cursor:"pointer",
                  border:"2px solid "+(on?TIER_COLORS[t]:"rgba(255,255,255,0.06)"),
                  background:on?"rgba(255,255,255,0.05)":"transparent",
                  display:"flex",justifyContent:"space-between",alignItems:"center"
                }}>
                  <span style={{color:on?TIER_COLORS[t]:"#475569",fontWeight:700,fontSize:13}}>
                    {icons[t]} Lv{t}　{TIER_LABELS[t]}
                  </span>
                  <span style={{color:"#475569",fontSize:10}}>{TIER_DESC[t]}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{background:"#1e293b",borderRadius:14,padding:14,marginBottom:14}}>
          <p style={{color:"#94a3b8",fontSize:11,fontWeight:700,margin:"0 0 10px"}}>▶ 出題範囲</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {TOPICS.map(t=>{
              const tc=TC[t]||TC["明"];const on=selTopics.has(t);
              const cnt=ALL_QUESTIONS.filter(q=>q.topic===t&&selTiers.has(q.tier)).length;
              return <button key={t} onClick={()=>toggleTopic(t)} style={{
                padding:"7px 10px",borderRadius:16,fontSize:10,fontWeight:700,cursor:"pointer",
                border:"2px solid "+(on?tc.accent:"transparent"),
                background:on?tc.light:"rgba(255,255,255,0.02)",
                color:on?tc.accent:"#475569"
              }}>{t}({cnt})</button>;
            })}
          </div>
          <p style={{color:"#475569",fontSize:10,margin:"8px 0 0"}}>選択中: {totalSel}問</p>
        </div>

        <button onClick={startNormal} disabled={totalSel===0} style={{
          width:"100%",padding:"17px",borderRadius:13,fontSize:17,fontWeight:900,
          background:totalSel>0?"linear-gradient(90deg,#6366f1,#8b5cf6)":"#334155",
          color:totalSel>0?"#fff":"#64748b",border:"none",cursor:totalSel>0?"pointer":"default",
          boxShadow:totalSel>0?"0 8px 24px rgba(99,102,241,0.4)":"none"
        }}>🚀 テスト開始！（{totalSel}問）</button>

        <div style={{marginTop:12,background:"#1e293b",borderRadius:12,padding:12}}>
          <p style={{color:"#64748b",fontSize:10,margin:0,lineHeight:1.9}}>
            📝 暗記（Lv1-2）→ まず120問を完璧に<br/>
            ⚖️ 比較（Lv3）→ AとBの違いを説明できるか<br/>
            📅 順番（Lv4）→ 歴史の流れを整理できるか<br/>
            🔗 因果（Lv5）→ なぜ？どうなった？を説明できるか<br/>
            🔥 間違えた問題は苦手モードに自動追加
          </p>
        </div>
      </div>
    </div>
  );

  if(mode==="result"){
    const pct=Math.round(score/qs.length*100);
    const wrong=results.filter(r=>!r.correct);
    return (
      <div style={{...F,minHeight:"100vh",background:"#0f172a",padding:"18px 14px",boxSizing:"border-box"}}>
        <div style={{maxWidth:500,margin:"0 auto"}}>
          <div style={{background:"#1e293b",borderRadius:16,padding:22,textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:44}}>{pct>=80?"🏆":pct>=60?"💪":"📖"}</div>
            <h2 style={{color:"#f1f5f9",margin:"6px 0 2px",fontSize:18}}>{isWeak?"苦手問題":"テスト"}結果</h2>
            <div style={{fontSize:42,fontWeight:900,color:pct>=80?"#4ade80":pct>=60?"#facc15":"#f87171"}}>
              {score}<span style={{fontSize:18,color:"#475569"}}>/{qs.length}</span>
            </div>
            <div style={{color:"#94a3b8",fontSize:15}}>{pct}点</div>
            {weakIds.size>0&&<div style={{marginTop:10,padding:"6px 12px",background:"rgba(248,113,113,0.1)",borderRadius:8,fontSize:11,color:"#f87171"}}>🔥 苦手: {weakIds.size}問蓄積中</div>}
          </div>
          {wrong.length>0&&(
            <div style={{background:"#1e293b",borderRadius:14,padding:16,marginBottom:14}}>
              <h3 style={{color:"#f87171",fontSize:13,margin:"0 0 12px"}}>❌ 間違えた問題（{wrong.length}問）→ 苦手に追加済み</h3>
              {wrong.map((r,i)=>{
                const tc=TC[r.topic]||TC["明"];
                return (
                  <div key={i} style={{marginBottom:12,padding:12,borderRadius:10,background:"rgba(0,0,0,0.3)",borderLeft:`3px solid ${tc.accent}`}}>
                    <div style={{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                      <span style={{color:tc.accent,fontSize:9,fontWeight:700}}>{r.topic}</span>
                      <span style={{color:KIND_COLORS[r.kind],fontSize:9,fontWeight:700}}>{KIND_ICONS[r.kind]}{KIND_LABELS[r.kind]}</span>
                    </div>
                    <div style={{color:"#e2e8f0",fontSize:12,marginBottom:6,lineHeight:1.5}}>{r.q}</div>
                    {r.picked&&<div style={{color:"#f87171",fontSize:11,marginBottom:2}}>選択: {r.picked}</div>}
                    <div style={{color:"#4ade80",fontSize:12,fontWeight:700,lineHeight:1.5}}>正解: {r.a}</div>
                  </div>
                );
              })}
            </div>
          )}
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <button onClick={isWeak?startWeak:startNormal} style={{flex:1,padding:"14px",borderRadius:12,fontSize:13,fontWeight:700,background:"linear-gradient(90deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",cursor:"pointer"}}>🔄 もう一度</button>
            {weakIds.size>0&&!isWeak&&<button onClick={startWeak} style={{flex:1,padding:"14px",borderRadius:12,fontSize:13,fontWeight:700,background:"linear-gradient(90deg,#ef4444,#f97316)",color:"#fff",border:"none",cursor:"pointer"}}>🔥 苦手を復習</button>}
          </div>
          <button onClick={()=>setMode("home")} style={{width:"100%",padding:"12px",borderRadius:12,fontSize:13,fontWeight:700,background:"rgba(255,255,255,0.06)",color:"#94a3b8",border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer"}}>🏠 トップへ</button>
        </div>
      </div>
    );
  }

  if(!q)return null;
  const kindHint={memory:"",compare:"【比較】2つを比べて違いを説明しよう",order:"【順番】正しい流れ・時系列を答えよう",cause:"【因果関係】なぜ起きたか、その結果どうなったかを説明しよう"};
  return (
    <div style={{...F,minHeight:"100vh",background:"#0f172a",padding:"14px",boxSizing:"border-box"}}>
      <div style={{maxWidth:500,margin:"0 auto"}}>
        {isWeak&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:8,padding:"5px 12px",marginBottom:10,fontSize:11,color:"#f87171",fontWeight:700}}>🔥 苦手問題モード</div>}
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{color:"#94a3b8",fontSize:12}}>{cur+1} / {qs.length}問</span>
            <span style={{color:"#4ade80",fontSize:12,fontWeight:700}}>✅ {score}問正解</span>
          </div>
          <div style={{height:5,background:"rgba(255,255,255,0.08)",borderRadius:10}}>
            <div style={{height:"100%",borderRadius:10,background:"linear-gradient(90deg,#6366f1,#8b5cf6)",width:`${prog}%`,transition:"width 0.3s"}}/>
          </div>
        </div>
        <div style={{marginBottom:10,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{background:c.accent,color:"#fff",padding:"3px 10px",borderRadius:20,fontSize:10,fontWeight:700}}>{q.topic}</span>
          <span style={{background:KIND_COLORS[q.kind]+"22",color:KIND_COLORS[q.kind],padding:"3px 8px",borderRadius:12,fontSize:10,fontWeight:700}}>{KIND_ICONS[q.kind]}{KIND_LABELS[q.kind]}</span>
          {weakIds.has(q.id)&&<span style={{color:"#f87171",fontSize:10}}>🔥苦手</span>}
        </div>
        {q.kind!=="memory"&&(
          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"8px 12px",marginBottom:10,fontSize:11,color:"#64748b"}}>{kindHint[q.kind]}</div>
        )}
        <div style={{background:"#1e293b",borderRadius:14,padding:18,marginBottom:14,borderLeft:`4px solid ${c.accent}`}}>
          <p style={{color:"#f1f5f9",fontSize:15,lineHeight:1.85,margin:0,fontWeight:600}}>{q.q}</p>
        </div>
        {q.type==="choice"&&(
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
            {q.choices.map((ch,i)=>{
              let bg="rgba(255,255,255,0.04)",border="rgba(255,255,255,0.07)",col="#e2e8f0";
              if(revealed){if(ch===q.a){bg="rgba(74,222,128,0.15)";border="#4ade80";col="#4ade80";}else if(ch===picked){bg="rgba(248,113,113,0.15)";border="#f87171";col="#f87171";}}
              return <button key={i} onClick={()=>pickChoice(ch)} style={{padding:"13px",borderRadius:11,textAlign:"left",background:bg,border:`2px solid ${border}`,color:col,fontSize:13,fontWeight:600,cursor:revealed?"default":"pointer",lineHeight:1.6}}><span style={{color:"#475569",marginRight:6}}>{"アイウエ"[i]}．</span>{ch}</button>;
            })}
            {revealed&&<button onClick={advance} style={{marginTop:4,padding:"15px",borderRadius:11,fontSize:15,fontWeight:900,background:"linear-gradient(90deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",cursor:"pointer"}}>{cur+1>=qs.length?"結果を見る 🏁":"次の問題 →"}</button>}
          </div>
        )}
        {q.type==="qa"&&(
          <div style={{marginBottom:14}}>
            {!revealed?(
              <button onClick={()=>setRevealed(true)} style={{width:"100%",padding:"17px",borderRadius:11,fontSize:15,fontWeight:700,background:c.light,border:`2px solid ${c.accent}`,color:c.accent,cursor:"pointer"}}>💡 答えを見る</button>
            ):(
              <>
                <div style={{background:"rgba(74,222,128,0.1)",borderRadius:12,padding:16,marginBottom:12,border:"2px solid #4ade80"}}>
                  <div style={{color:"#4ade80",fontSize:11,fontWeight:700,marginBottom:6}}>✅ 正解</div>
                  <div style={{color:"#f1f5f9",fontSize:14,fontWeight:600,lineHeight:1.8}}>{q.a}</div>
                </div>
                <p style={{color:"#64748b",fontSize:11,textAlign:"center",margin:"0 0 10px"}}>自己採点してください</p>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>selfScore(true)} style={{flex:1,padding:"17px 10px",borderRadius:11,fontSize:15,fontWeight:900,background:"rgba(74,222,128,0.15)",border:"2px solid #4ade80",color:"#4ade80",cursor:"pointer"}}>⭕<br/><span style={{fontSize:11}}>正解</span></button>
                  <button onClick={()=>selfScore(false)} style={{flex:1,padding:"17px 10px",borderRadius:11,fontSize:15,fontWeight:900,background:"rgba(248,113,113,0.15)",border:"2px solid #f87171",color:"#f87171",cursor:"pointer"}}>❌<br/><span style={{fontSize:11}}>不正解</span></button>
                </div>
              </>
            )}
          </div>
        )}
        <button onClick={()=>setMode("home")} style={{width:"100%",padding:"9px",borderRadius:10,fontSize:11,background:"transparent",border:"1px solid rgba(255,255,255,0.07)",color:"#475569",cursor:"pointer"}}>⬅ トップへ</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
