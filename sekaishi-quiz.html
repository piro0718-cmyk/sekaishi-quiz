{id:178,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"後三条天皇が藤原氏を排除できた理由は？",a:"藤原氏を外戚にもたなかったため"},
{id:179,tier:4,topic:"日本史（鎌倉〜戦国）",type:"choice",q:"白河天皇の「天下三不如意」とは何を表すか？",choices:["三種の神器の意味", "自分の思い通りにならないものへの嘆き", "仏教の三つの教え", "三つの政策目標"],a:"自分の思い通りにならないものへの嘆き"},

{id:181,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"平清盛が太政大臣になった背景は？",a:"保元の乱・平治の乱（1156・1159）で平氏が台頭したため"},
{id:182,tier:4,topic:"日本史（鎌倉〜戦国）",type:"choice",q:"平清盛が厳島神社を建立した目的は？",choices:["仏教の普及", "日宋貿易の安全祈念", "源氏への対抗", "天皇への忠誠の証"],a:"日宋貿易の安全祈念"},
{id:183,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"執権政治とは何か？",a:"源氏3代断絶後、北条氏が執権として実権を握った政治形態"},
{id:184,tier:4,topic:"日本史（鎌倉〜戦国）",type:"choice",q:"建武の新政が失敗した主な理由は？",choices:["元の侵攻", "天皇親政・公家優先で武家の不満爆発→足利尊氏が離反", "足利尊氏の暗殺", "天皇が死去"],a:"天皇親政・公家優先で武家の不満爆発→足利尊氏が離反"},
{id:185,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"室町幕府の成立年と開いた人物は？",a:"1338年。足利尊氏"},

{id:187,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"応仁の乱が起きた年と、その後の社会変動を答えよ",a:"1467年。下剋上（実力で上の者を倒せる時代）→戦国時代へ"},

{id:189,tier:4,topic:"日本史（鎌倉〜戦国）",type:"choice",q:"フランシスコ＝ザビエルが日本に来訪した年と所属組織は？",choices:["1543年・ドミニコ会", "1549年・イエズス会", "1600年・フランシスコ会", "1543年・イエズス会"],a:"1549年・イエズス会"},
{id:190,tier:4,topic:"仏教・ヒンドゥー教",type:"qa",q:"インドの宗教史を時系列で整理せよ（バラモン教からイスラムまで）",a:"アーリヤ人侵入→ヴェーダ→バラモン教→前6世紀仏教誕生→マウリア・クシャーナ朝で保護→グプタ朝でヒンドゥー教成立→バクティ運動で仏教衰退→10世紀以降イスラム王朝"},
{id:191,tier:4,topic:"ムガル帝国",type:"qa",q:"ムガル帝国の宗教政策の変遷を整理せよ（3代〜6代）",a:"アクバル（融和・婚姻）→シャー＝ジャハーン（タージ＝マハル建設）→アウラングゼーブ（弾圧・寺院破壊）"},
{id:192,tier:4,topic:"モンゴル・元",type:"qa",q:"元の統治システム（ジャムチ・牌符）の機能と効果を説明せよ",a:"ジャムチ（駅伝制）で交通・通信整備→牌符（旅行証明書）で安全な移動保証→東西貿易活発化"},

{id:194,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"元寇の2回の戦いを整理せよ（年・名前・結果）",a:"1274年文永の役（撃退・悲惨だが時間がなかった）、1281年弘安の役（台風などで再び撃退）"},
{id:195,tier:4,topic:"日本史（鎌倉〜戦国）",type:"choice",q:"鎌倉幕府から室町幕府への流れの正しい順番は？",choices:["元寇→建武の新政→室町幕府", "建武の新政→元寇→室町幕府", "室町幕府→元寇→建武の新政", "元寇→室町幕府→建武の新政"],a:"元寇→建武の新政→室町幕府"},
{id:196,tier:4,topic:"古代オリエント",type:"qa",q:"「エジプトはナイルの賜物」という言葉の意味を説明せよ",a:"ナイル川の定期的な氾濫が肥沃な土地をもたらし、エジプト文明を育てたということ"},
{id:197,tier:4,topic:"シリア・パレスティナ",type:"qa",q:"ヘブライ人の歴史の流れを「出エジプト〜ディアスポラ」で整理せよ",a:"前1280年出エジプト→シナイ山で十戒→カナンに定住→前1000年王国成立（サウル→ダビデ→ソロモン）→分裂（イスラエル・ユダ）→大国支配→ディアスポラ"},
{id:198,tier:4,topic:"仏教・ヒンドゥー教",type:"qa",q:"仏教の「四苦」「煩悩」「解脱」の連関を説明せよ",a:"人生は四苦（生老病死）から逃れられない（一切皆苦）→苦しみの原因は煩悩→煩悩を消せば輪廻転生から解脱できる"},
{id:199,tier:4,topic:"モンゴル・元",type:"qa",q:"元の滅亡原因を複数の観点から説明せよ",a:"チベット仏教への傾倒による財政難・異民族支配への反発・反乱（紅巾の乱）→1351年滅亡"},
{id:200,tier:4,topic:"日本史（鎌倉〜戦国）",type:"qa",q:"室町時代の成立から戦国時代までの流れを整理せよ",a:"1338年足利尊氏室町幕府開く→南北朝動乱→1392年義満が統一・日明貿易→1467年応仁の乱→下剋上→戦国時代"},
{id:201,tier:5,topic:"古代オリエント",type:"qa",q:"エジプトとメソポタミアの文字・数・暦を比較表形式で答えよ",a:"エジプト：ヒエログリフ・十進法・太陽暦 ／ メソポタミア：くさび形文字・六十進法・太陰暦"},
{id:202,tier:5,topic:"古代オリエント",type:"choice",q:"ピラミッドと「死者の書」の関係は？",choices:["ピラミッドの設計書が死者の書", "ピラミッドは王の墓で死者の書は副葬品として収められ生前の善行を記したもの", "死者の書はピラミッド建設の記録", "死者の書はヒエログリフの解読書"],a:"ピラミッドは王の墓で死者の書は副葬品として収められ生前の善行を記したもの"},
{id:203,tier:5,topic:"古代オリエント",type:"qa",q:"ロゼッタストーンがヒエログリフ解読に役立った理由を詳しく説明せよ",a:"同じ内容がヒエログリフ・デモティック（民衆文字）・ギリシア語の3種で書かれており、ギリシア語部分から解読が進んだ"},
{id:204,tier:5,topic:"古代オリエント",type:"qa",q:"ギルガメッシュ叙事詩とはどのような作品か、歴史的意義も含めて説明せよ",a:"メソポタミア文明で生まれた現存する最古の文学作品。洪水神話なども含み聖書との類似が指摘される"},
{id:205,tier:5,topic:"シリア・パレスティナ",type:"qa",q:"アラム人・フェニキア人・ヘブライ人の活動を比較し、それぞれの文化的遺産を説明せよ",a:"アラム人：内陸中継貿易・アラム語（国際商業語）、フェニキア人：地中海独占・フェニキア文字（アルファベットの起源）、ヘブライ人：ユダヤ教（キリスト教・イスラム教の源流）"},
{id:206,tier:5,topic:"シリア・パレスティナ",type:"choice",q:"フェニキア文字→アルファベットへの流れで正しいのは？",choices:["フェニキア文字→中国語→アルファベット", "フェニキア文字→ヒエログリフ→アルファベット", "フェニキア文字→ギリシア・ローマを経てヨーロッパのアルファベットになった", "フェニキア文字→くさび形文字→アルファベット"],a:"フェニキア文字→ギリシア・ローマを経てヨーロッパのアルファベットになった"},
{id:207,tier:5,topic:"ヘブライ・ユダヤ教",type:"qa",q:"ソロモン神殿の「神の箱」に何が保管され、それはどのような意義を持つか？",a:"十戒を刻んだ石板が保管された。ヤハウェとの契約の証であり、ユダヤ教の聖なる象徴"},
{id:208,tier:5,topic:"ヘブライ・ユダヤ教",type:"qa",q:"ユダヤ教の「選民思想」「排他的思想」「律法」の関係を説明せよ",a:"神との約束である律法を守るユダヤ人だけが救われる（選民思想）→律法を守らない者・罪を犯した者に不寛容（排他的思想）"},
{id:209,tier:5,topic:"ヘブライ・ユダヤ教",type:"choice",q:"ユダヤ教・キリスト教の連続性の説明として正しいのは？",choices:["まったく無関係な宗教", "ユダヤ教のメシア待望→ローマ支配下でイエス登場→メシアかどうかの議論→キリスト教へ", "キリスト教からユダヤ教が生まれた", "同じ宗教の異なる呼び名"],a:"ユダヤ教のメシア待望→ローマ支配下でイエス登場→メシアかどうかの議論→キリスト教へ"},
{id:210,tier:5,topic:"インド文明",type:"qa",q:"インダス文明の3大特徴（印章・文字・沐浴）をそれぞれ詳しく説明せよ",a:"印章：交易における所有・権威の証明に使用。インダス文字：現在も未解読で詳細不明。沐浴：宗教的清潔の習慣（ヒンドゥー教の沐浴の起源とも）"},
{id:211,tier:5,topic:"インド文明",type:"qa",q:"アーリヤ人の「ヴェーダ」とバラモン教の関係を説明せよ",a:"自然現象崇拝の祭式知識→ヴェーダ（最古はリグヴェーダ）→司祭バラモンの地位向上→バラモン教成立"},
{id:212,tier:5,topic:"インド文明",type:"choice",q:"ヴァルナ制→ジャーティ→カースト制度への発展の説明として正しいのは？",choices:["ヴァルナ制廃止後カーストが成立", "ヴァルナ（4大身分）にジャーティ（出自・職業集団）が結びつき、のちにカースト制度と呼ばれた", "カースト制度がありその後ヴァルナ制になった", "ジャーティとヴァルナは無関係"],a:"ヴァルナ（4大身分）にジャーティ（出自・職業集団）が結びつき、のちにカースト制度と呼ばれた"},
{id:213,tier:5,topic:"仏教・ヒンドゥー教",type:"qa",q:"仏教の「一切皆苦→四苦→煩悩→解脱」の流れを説明せよ",a:"人生は苦しみ（一切皆苦）→四苦（生老病死）から誰も逃れられない→苦しみの原因は煩悩→煩悩を消せば輪廻転生から解脱できる。ブッダは生涯変わらない"},
{id:214,tier:5,topic:"仏教・ヒンドゥー教",type:"qa",q:"マウリア・クシャーナ・グプタ・ヴァルダナ朝の時代と仏教との関係を詳しく整理せよ",a:"マウリア（前3〜前2世紀・アショーカ王が保護）→クシャーナ（1〜3世紀・カニシカ王が保護）→グプタ（4〜6世紀・ヒンドゥー教成立・バクティ運動で仏教衰退）→ヴァルダナ（7世紀・玄奘来訪・大唐西域記）"},
{id:215,tier:5,topic:"仏教・ヒンドゥー教",type:"choice",q:"ヒンドゥー教の三主神・役割・特徴の正しい組み合わせは？",choices:["ブラフマー（破壊）・シヴァ（創造）・ヴィシュヌ（維持）", "ブラフマー（創造）・シヴァ（破壊と再生・踊り・息子ガネーシャ）・ヴィシュヌ（宇宙維持）", "シヴァ（創造）・ヴィシュヌ（破壊）・ブラフマー（維持）", "ガネーシャ（創造）・ブラフマー（破壊）・シヴァ（維持）"],a:"ブラフマー（創造）・シヴァ（破壊と再生・踊り・息子ガネーシャ）・ヴィシュヌ（宇宙維持）"},
{id:216,tier:5,topic:"ムガル帝国",type:"qa",q:"ムガル帝国の歴代皇帝（創始者・3代・5代・6代）と主要政策を整理せよ",a:"バーブル（創始・チンギス末えい自称）→アクバル3代（融和・ラージプート族婚姻）→シャー＝ジャハーン5代（タージ＝マハル建設）→アウラングゼーブ6代（ヒンドゥー教弾圧・寺院破壊）"},
{id:217,tier:5,topic:"ムガル帝国",type:"qa",q:"タージ＝マハルの建設背景・建設者・被建設者・歴史的意義を説明せよ",a:"5代皇帝シャー＝ジャハーンが愛妻ムムターズ＝マハルのために建設した廟。イスラム建築の傑作で世界遺産"},
{id:218,tier:5,topic:"ムガル帝国",type:"choice",q:"アウラングゼーブのヒンドゥー弾圧→帝国滅亡の流れとして正しいのは？",choices:["弾圧→ヒンドゥー教消滅→帝国安定", "弾圧→ヒンドゥー教徒反発→不安定化→イギリス植民地化→1858年滅亡", "弾圧→仏教が台頭→帝国滅亡", "弾圧→清が侵攻→滅亡"],a:"弾圧→ヒンドゥー教徒反発→不安定化→イギリス植民地化→1858年滅亡"},
{id:219,tier:5,topic:"モンゴル・元",type:"qa",q:"チンギス＝ハンの出現から元の成立までの流れを詳しく説明せよ",a:"テムジン→クリルタイでハン選出→チンギス＝ハンへ→周辺国征服→大きくなりすぎ→4ハン国と元（中国風に改名）に分裂→元建国者フビライ＝ハン"},
{id:220,tier:5,topic:"モンゴル・元",type:"qa",q:"元の統治システム（ジャムチ・牌符・貿易）の機能と連鎖効果を説明せよ",a:"ジャムチ（駅伝制）で交通・通信整備→牌符（旅行証明書）で安全な移動保証→東西貿易活発化→マルコ＝ポーロなど西方商人が来訪→東方の情報がヨーロッパに伝わる"},
{id:221,tier:5,topic:"モンゴル・元",type:"choice",q:"マルコ＝ポーロの来訪から大航海時代への連鎖は？",choices:["来訪→貿易独占→鎖国", "来訪→世界の記録著作→ヨーロッパに東方の豊かさを伝える→大航海時代の遠因", "来訪→元の滅亡→明の成立", "来訪→ローマ教皇との関係構築"],a:"来訪→世界の記録著作→ヨーロッパに東方の豊かさを伝える→大航海時代の遠因"},
{id:222,tier:5,topic:"モンゴル・元",type:"qa",q:"元の滅亡原因を「チベット仏教・財政・反乱」の観点から説明せよ",a:"チベット仏教への傾倒→財政難→それに加えて異民族支配への反発・紅巾の乱などの反乱→1351年滅亡"},
{id:223,tier:5,topic:"モンゴル・元",type:"qa",q:"元寇（文永の役・弘安の役）の経緯と鎌倉幕府への影響を詳しく説明せよ",a:"元が日本に服属要求→拒否→1274年文永の役（撃退）→1281年弘安の役（台風で撃退）→北条時宗が執権の時→恩賞問題→御家人弱体化→幕府衰退→1333年滅亡"},
{id:224,tier:5,topic:"明",type:"qa",q:"明の冊封体制・朝貢貿易の仕組みと冊封国のメリット・デメリットを詳しく説明せよ",a:"冊封：中国皇帝が周辺国君主に官位を授与し主従関係（中国が兄・上）を結ぶ。朝貢貿易：冊封国は貿易可能・交通費・滞在費は中国持ち・利益大。デメリット：弟分・臣下の立場になる"},
{id:225,tier:5,topic:"明",type:"choice",q:"鄭和の南海遠征（1408〜33）の意義として正しいのは？",choices:["民間貿易の促進", "コンパスの発明", "官による遠征で近隣国を冊封体制に組み込んだ・当時の先進的航海技術（コンパスの100年前）", "インドの征服"],a:"官による遠征で近隣国を冊封体制に組み込んだ・当時の先進的航海技術（コンパスの100年前）"},

const TOPICS = [...new Set(ALL_QUESTIONS.map(q => q.topic))];
const TIERS = [1,2,3,4,5];
const TIER_LABELS = {1:"大枠",2:"やや詳細",3:"もっと詳細",4:"さらに詳細",5:"最詳細"};
const TC = {
  "古代オリエント":       {accent:"#f59e0b",light:"rgba(245,158,11,0.15)"},
  "シリア・パレスティナ": {accent:"#ec4899",light:"rgba(236,72,153,0.15)"},
  "ヘブライ・ユダヤ教":   {accent:"#7c3aed",light:"rgba(124,58,237,0.15)"},
  "インド文明":           {accent:"#10b981",light:"rgba(16,185,129,0.15)"},
  "仏教・ヒンドゥー教":   {accent:"#14b8a6",light:"rgba(20,184,166,0.15)"},
  "ムガル帝国":           {accent:"#f97316",light:"rgba(249,115,22,0.15)"},
  "モンゴル・元":         {accent:"#ef4444",light:"rgba(239,68,68,0.15)"},
  "明":                   {accent:"#22c55e",light:"rgba(34,197,94,0.15)"},
  "日本史（鎌倉〜戦国）": {accent:"#a855f7",light:"rgba(168,85,247,0.15)"},
};
const TIER_COLORS = {1:"#4ade80",2:"#facc15",3:"#fb923c",4:"#f87171",5:"#c084fc"};

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}

function App(){
  const [mode,setMode]=useState("home");
  const [selTopics,setSelTopics]=useState(new Set(TOPICS));
  const [selTiers,setSelTiers]=useState(new Set([1,2,3,4,5]));
  const [qs,setQs]=useState([]);
  const [cur,setCur]=useState(0);
  const [revealed,setRevealed]=useState(false);
  const [picked,setPicked]=useState(null);
  const [score,setScore]=useState(0);
  const [results,setResults]=useState([]);
  const F={fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif"};

  function start(){
    const f=shuffle(ALL_QUESTIONS.filter(q=>selTopics.has(q.topic)&&selTiers.has(q.tier)));
    if(f.length===0)return;
    setQs(f);setCur(0);setScore(0);setResults([]);setRevealed(false);setPicked(null);setMode("quiz");
  }
  function toggleTopic(t){setSelTopics(p=>{const n=new Set(p);if(n.has(t)){if(n.size>1)n.delete(t);}else n.add(t);return n;});}
  function toggleTier(t){setSelTiers(p=>{const n=new Set(p);if(n.has(t)){if(n.size>1)n.delete(t);}else n.add(t);return n;});}
  function pickChoice(ch){
    if(revealed)return;
    setPicked(ch);setRevealed(true);
    const ok=ch===qs[cur].a;
    if(ok)setScore(s=>s+1);
    setResults(r=>[...r,{...qs[cur],correct:ok,picked:ch}]);
  }
  function selfScore(ok){
    if(ok)setScore(s=>s+1);
    setResults(r=>[...r,{...qs[cur],correct:ok}]);
    advance();
  }
  function advance(){
    setRevealed(false);setPicked(null);
    if(cur+1>=qs.length)setMode("result");else setCur(c=>c+1);
  }

  const q=qs[cur];
  const c=q?(TC[q.topic]||TC["明"]):null;
  const totalSel=ALL_QUESTIONS.filter(q=>selTopics.has(q.topic)&&selTiers.has(q.tier)).length;

  if(mode==="home") return (
    <div style={{...F,minHeight:"100vh",background:"#0f172a",padding:"20px 14px",boxSizing:"border-box"}}>
      <div style={{maxWidth:500,margin:"0 auto"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:40,marginBottom:4}}>📜</div>
          <h1 style={{color:"#f1f5f9",fontSize:21,fontWeight:900,margin:0}}>世界史テスト対策</h1>
          <p style={{color:"#64748b",fontSize:12,margin:"4px 0 0"}}>全250問 ／ 難易度5段階</p>
        </div>

        <div style={{background:"#1e293b",borderRadius:14,padding:16,marginBottom:12}}>
          <p style={{color:"#94a3b8",fontSize:11,fontWeight:700,margin:"0 0 10px",letterSpacing:"0.05em"}}>▶ 難易度を選ぶ</p>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {TIERS.map(t=>{
              const on=selTiers.has(t);
              const cnt=ALL_QUESTIONS.filter(q=>q.tier===t).length;
              return <button key={t} onClick={()=>toggleTier(t)} style={{
                padding:"8px 10px",borderRadius:16,fontSize:11,fontWeight:700,cursor:"pointer",
                border:"2px solid "+(on?TIER_COLORS[t]:"transparent"),
                background:on?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.03)",
                color:on?TIER_COLORS[t]:"#475569"
              }}>Lv{t} {TIER_LABELS[t]}({cnt})</button>;
            })}
          </div>
        </div>

        <div style={{background:"#1e293b",borderRadius:14,padding:16,marginBottom:14}}>
          <p style={{color:"#94a3b8",fontSize:11,fontWeight:700,margin:"0 0 10px",letterSpacing:"0.05em"}}>▶ 出題範囲を選ぶ</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {TOPICS.map(t=>{
              const tc=TC[t]||TC["明"];const on=selTopics.has(t);
              const cnt=ALL_QUESTIONS.filter(q=>q.topic===t&&selTiers.has(q.tier)).length;
              return <button key={t} onClick={()=>toggleTopic(t)} style={{
                padding:"7px 10px",borderRadius:16,fontSize:11,fontWeight:700,cursor:"pointer",
                border:"2px solid "+(on?tc.accent:"transparent"),
                background:on?tc.light:"rgba(255,255,255,0.03)",
                color:on?tc.accent:"#475569"
              }}>{t}({cnt})</button>;
            })}
          </div>
          <p style={{color:"#475569",fontSize:10,margin:"8px 0 0"}}>選択中: {totalSel}問</p>
        </div>

        <button onClick={start} disabled={totalSel===0} style={{
          width:"100%",padding:"18px",borderRadius:14,fontSize:18,fontWeight:900,
          background:totalSel>0?"linear-gradient(90deg,#6366f1,#8b5cf6)":"#334155",
          color:totalSel>0?"#fff":"#64748b",border:"none",cursor:totalSel>0?"pointer":"default",
          boxShadow:totalSel>0?"0 8px 24px rgba(99,102,241,0.4)":"none"
        }}>🚀 テスト開始！</button>

        <div style={{marginTop:12,background:"#1e293b",borderRadius:12,padding:12}}>
          <p style={{color:"#64748b",fontSize:10,margin:0,lineHeight:1.8}}>
            💡 Lv1大枠→Lv5最詳細の順で難しくなります<br/>
            💡 一問一答：「答えを見る」→ ⭕/❌で自己採点<br/>
            💡 選択問題：4択をタップで即判定
          </p>
        </div>
      </div>
    </div>
  );

  if(mode==="result"){
    const pct=Math.round(score/qs.length*100);
    const wrong=results.filter(r=>!r.correct);
    return (
      <div style={{...F,minHeight:"100vh",background:"#0f172a",padding:"20px 14px",boxSizing:"border-box"}}>
        <div style={{maxWidth:500,margin:"0 auto"}}>
          <div style={{background:"#1e293b",borderRadius:16,padding:22,textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:48}}>{pct>=80?"🏆":pct>=60?"💪":"📖"}</div>
            <h2 style={{color:"#f1f5f9",margin:"6px 0 2px",fontSize:18}}>結果</h2>
            <div style={{fontSize:44,fontWeight:900,color:pct>=80?"#4ade80":pct>=60?"#facc15":"#f87171"}}>
              {score}<span style={{fontSize:18,color:"#475569"}}>/{qs.length}</span>
            </div>
            <div style={{color:"#94a3b8",fontSize:15}}>{pct}点</div>
          </div>
          {wrong.length>0&&(
            <div style={{background:"#1e293b",borderRadius:14,padding:16,marginBottom:14}}>
              <h3 style={{color:"#f87171",fontSize:13,margin:"0 0 12px"}}>❌ 間違えた問題（{wrong.length}問）</h3>
              {wrong.map((r,i)=>{
                const tc=TC[r.topic]||TC["明"];
                return (
                  <div key={i} style={{marginBottom:12,padding:12,borderRadius:10,background:"rgba(0,0,0,0.3)",borderLeft:`3px solid ${tc.accent}`}}>
                    <div style={{color:tc.accent,fontSize:9,fontWeight:700,marginBottom:3}}>{r.topic} Lv{r.tier} {TIER_LABELS[r.tier]}</div>
                    <div style={{color:"#e2e8f0",fontSize:12,marginBottom:6,lineHeight:1.5}}>{r.q}</div>
                    {r.picked&&<div style={{color:"#f87171",fontSize:11,marginBottom:2}}>選択: {r.picked}</div>}
                    <div style={{color:"#4ade80",fontSize:12,fontWeight:700}}>正解: {r.a}</div>
                  </div>
                );
              })}
            </div>
          )}
          <div style={{display:"flex",gap:10}}>
            <button onClick={start} style={{flex:1,padding:"16px",borderRadius:12,fontSize:14,fontWeight:700,background:"linear-gradient(90deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",cursor:"pointer"}}>🔄 もう一度</button>
            <button onClick={()=>setMode("home")} style={{flex:1,padding:"16px",borderRadius:12,fontSize:14,fontWeight:700,background:"rgba(255,255,255,0.07)",color:"#94a3b8",border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer"}}>🏠 トップ</button>
          </div>
        </div>
      </div>
    );
  }

  if(!q)return null;
  const prog=(cur/qs.length)*100;
  return (
    <div style={{...F,minHeight:"100vh",background:"#0f172a",padding:"16px 14px",boxSizing:"border-box"}}>
      <div style={{maxWidth:500,margin:"0 auto"}}>
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{color:"#94a3b8",fontSize:12}}>{cur+1} / {qs.length}問</span>
            <span style={{color:"#4ade80",fontSize:12,fontWeight:700}}>✅ {score}問正解</span>
          </div>
          <div style={{height:5,background:"rgba(255,255,255,0.08)",borderRadius:10}}>
            <div style={{height:"100%",borderRadius:10,background:"linear-gradient(90deg,#6366f1,#8b5cf6)",width:`${prog}%`,transition:"width 0.3s"}}/>
          </div>
        </div>

        <div style={{marginBottom:10,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{background:c.accent,color:"#fff",padding:"3px 10px",borderRadius:20,fontSize:10,fontWeight:700}}>{q.topic}</span>
          <span style={{background:TIER_COLORS[q.tier]+"22",color:TIER_COLORS[q.tier],padding:"3px 8px",borderRadius:12,fontSize:10,fontWeight:700}}>Lv{q.tier} {TIER_LABELS[q.tier]}</span>
          <span style={{color:"#475569",fontSize:10}}>{q.type==="qa"?"一問一答":"選択"}</span>
        </div>

        <div style={{background:"#1e293b",borderRadius:14,padding:20,marginBottom:14,borderLeft:`4px solid ${c.accent}`}}>
          <p style={{color:"#f1f5f9",fontSize:16,lineHeight:1.8,margin:0,fontWeight:600}}>{q.q}</p>
        </div>

        {q.type==="choice"&&(
          <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:14}}>
            {q.choices.map((ch,i)=>{
              let bg="rgba(255,255,255,0.05)",border="rgba(255,255,255,0.08)",col="#e2e8f0";
              if(revealed){
                if(ch===q.a){bg="rgba(74,222,128,0.15)";border="#4ade80";col="#4ade80";}
                else if(ch===picked){bg="rgba(248,113,113,0.15)";border="#f87171";col="#f87171";}
              }
              return (
                <button key={i} onClick={()=>pickChoice(ch)} style={{
                  padding:"14px",borderRadius:12,textAlign:"left",
                  background:bg,border:`2px solid ${border}`,color:col,
                  fontSize:14,fontWeight:600,cursor:revealed?"default":"pointer",lineHeight:1.5
                }}>
                  <span style={{color:"#475569",marginRight:6}}>{"アイウエ"[i]}．</span>{ch}
                </button>
              );
            })}
            {revealed&&(
              <button onClick={advance} style={{
                marginTop:4,padding:"16px",borderRadius:12,fontSize:15,fontWeight:900,
                background:"linear-gradient(90deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",cursor:"pointer"
              }}>{cur+1>=qs.length?"結果を見る 🏁":"次の問題 →"}</button>
            )}
          </div>
        )}

        {q.type==="qa"&&(
          <div style={{marginBottom:14}}>
            {!revealed?(
              <button onClick={()=>setRevealed(true)} style={{
                width:"100%",padding:"18px",borderRadius:12,fontSize:16,fontWeight:700,
                background:c.light,border:`2px solid ${c.accent}`,color:c.accent,cursor:"pointer"
              }}>💡 答えを見る</button>
            ):(
              <>
                <div style={{background:"rgba(74,222,128,0.1)",borderRadius:12,padding:18,marginBottom:12,border:"2px solid #4ade80"}}>
                  <div style={{color:"#4ade80",fontSize:11,fontWeight:700,marginBottom:6}}>✅ 正解</div>
                  <div style={{color:"#f1f5f9",fontSize:16,fontWeight:900,lineHeight:1.7}}>{q.a}</div>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>selfScore(true)} style={{
                    flex:1,padding:"18px 10px",borderRadius:12,fontSize:16,fontWeight:900,
                    background:"rgba(74,222,128,0.15)",border:"2px solid #4ade80",color:"#4ade80",cursor:"pointer"
                  }}>⭕<br/><span style={{fontSize:11}}>正解</span></button>
                  <button onClick={()=>selfScore(false)} style={{
                    flex:1,padding:"18px 10px",borderRadius:12,fontSize:16,fontWeight:900,
                    background:"rgba(248,113,113,0.15)",border:"2px solid #f87171",color:"#f87171",cursor:"pointer"
                  }}>❌<br/><span style={{fontSize:11}}>不正解</span></button>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
